    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            background-color: #f9f9f9;
        }
        .time {

            display: flex;
            justify-content: center;
            align-items: center;
            width: 90%;
            height: 45px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 20px;
            
            }
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 5px;
            align-items: center;
            width: 75%;
        }
        .columns {
            display: flex;
            justify-content: space-around;
            width: 120%;
        }
        .column {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        input {
            width: 80px;
            padding: 5px;
            margin-top: 5px;
            text-align: center;
            font-size: 16px;
        }
        .keyboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
            width: 90%;
        }
        .key {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 60px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 20px;
            cursor: pointer;
        }
        .key:active {
            background-color: #ddd;
        }
        #result-box {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            width: 90%;
            text-align: center;
            font-weight: bold;
            background-color: #fff;
        }
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
            width: 90%;
        }
        .action-buttons button {
            padding: 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            border: none;
            text-align: center;
        }
        .action-buttons button:active {
            background-color: #0056b3;
        }
        .screenshot-button button {
            background-color: #28a745;
        }
        .screenshot-button button:active {
            background-color: #218838;
        }
    </style>

<link rel="manifest" href="manifest.json" />

</head>
<body>
        <div class="time">
            <a href="https://24timezones.com" style="text-decoration: none" class="clock24" id="tz24-1757844616-c1133-eyJob3VydHlwZSI6IjI0Iiwic2hvd2RhdGUiOiIxIiwic2hvd3NlY29uZHMiOiIxIiwic2hvd3RpbWV6b25lIjoiMCIsInR5cGUiOiJkIiwibGFuZyI6InB0In0=" title="Relógio" target="_blank" rel="nofollow"></a>
<script type="text/javascript" src="//w.24timezones.com/l.js" async></script>
          </div>  
    
        <div class="container">
        <!-- VALVULA -->
        <div class="column">
            <label for="col0">VALVULA</label>
            <input type="number" id="col0" placeholder=" - " readonly>
        </div>
        <!-- células -->
        <div class="columns">
            <div class="column">
                <label for="col1">Entrada</label>
                <input type="number" id="col1" placeholder=" - " readonly>
            </div>
            <div class="column">
                <label for="col2">Saida</label>
                <input type="number" id="col2" placeholder=" - " readonly>
            </div>
            <div class="column">
                <label for="col3">Vasos</label>
                <input type="number" id="col3" placeholder=" - " readonly>
            </div>
        </div>
            <div id="result-box"> Introduza os dados </div>
    </div>
    

    <div class="keyboard">
        <!-- Keyboard -->
        <div class="key" onclick="addNumber(1)">1</div>
        <div class="key" onclick="addNumber(2)">2</div>
        <div class="key" onclick="addNumber(3)">3</div>
        <div class="key" onclick="addNumber(4)">4</div>
        <div class="key" onclick="addNumber(5)">5</div>
        <div class="key" onclick="addNumber(6)">6</div>
        <div class="key" onclick="addNumber(7)">7</div>
        <div class="key" onclick="addNumber(8)">8</div>
        <div class="key" onclick="addNumber(9)">9</div>
        <div class="key" onclick="clearAll()">C</div>
        <div class="key" onclick="addNumber(0)">0</div>
        <div class="key" onclick="deleteLast()">⌫</div>
    </div>

 <div class="action-buttons">
        <button onclick="nextColumn()">Próximo</button>
        <button id="save-btn" style="background-color: #28a745; color: white;">Guardar Resultado</button>
    </div>

    <div id="history-container" style="width: 90%; margin-top: 20px; display: flex; flex-direction: column; align-items: center; text-align: left;">
        <h3 style="margin-bottom: 10px; text-align: center;">Histórico de Drenagem</h3>
        <div id="history-list" style="width: 100%; border-radius: 5px; min-height: 50px; padding: 5px; box-sizing: border-box;">
            </div>
        <button onclick="clearHistory()" style="margin-top: 15px; padding: 10px; background-color: #dc3545; color: white; border: none; border-radius: 5px; cursor: pointer; width: 100%;">Limpar Tudo</button>
    </div>

  <script>
        let activeInput = document.getElementById("col0"); 

        document.querySelectorAll("input").forEach(input => {
            input.addEventListener("click", () => {
                activeInput = input;
            });
        });

        function addNumber(num) {
            if (activeInput) {
                activeInput.value += num;
                checkAndCalculate(); 
            }
        }

        function clearAll() {
            document.querySelectorAll("input").forEach(input => {
                input.value = "";
            });
            document.getElementById("result-box").textContent = "Resultado: ---";
            activeInput = document.getElementById("col0");
            activeInput.focus(); 
        }

        function deleteLast() {
            if (activeInput) {
                activeInput.value = activeInput.value.slice(0, -1);
            }
        }

        function checkAndCalculate() {
            const col1 = document.getElementById("col1").value;
            const col2 = document.getElementById("col2").value;
            const col3 = document.getElementById("col3").value;

            if (col1 && col2 && col3) {
                calculate();
            }
        }

        function calculate() {
            const col1Value = parseFloat(document.getElementById("col1").value);
            const col2Value = parseFloat(document.getElementById("col2").value);
            const col3Value = parseFloat(document.getElementById("col3").value);

            if (isNaN(col1Value) || isNaN(col2Value) || isNaN(col3Value) || col1Value === 0 || col3Value === 0) {
                document.getElementById("result-box").textContent = "ERROR!";
                return;
            }

            const result = (col2Value / col1Value / col3Value) * 100;
            document.getElementById("result-box").textContent = ` ${result.toFixed(2)}%`;
        }

        function nextColumn() {
            const inputs = ["col0", "col1", "col2", "col3"];
            const currentIndex = inputs.indexOf(activeInput.id);
            const nextIndex = (currentIndex + 1) % inputs.length;
            activeInput = document.getElementById(inputs[nextIndex]);
            activeInput.focus(); 
        }

        document.getElementById("screenshot-btn").addEventListener("click", function () {
      html2canvas(document.body).then(canvas => {
// Функція для збереження результату
        document.getElementById("save-btn").addEventListener("click", function() {
            const valvula = document.getElementById("col0").value;
            const entrada = document.getElementById("col1").value;
            const saida = document.getElementById("col2").value;
            const resultText = document.getElementById("result-box").textContent.trim();

            // Перевіряємо, чи всі потрібні дані введені
            if (!valvula || !entrada || !saida || resultText === "ERROR!" || resultText === "Introduza os dados") {
                alert("Por favor, preencha a Válvula, Entrada, Saída e certifique-se de que o resultado está correto!");
                return;
            }

            // Отримуємо поточну дату та час
            const now = new Date();
            const dateStr = now.toLocaleDateString('pt-PT'); // Формат: 10/06/2026
            const timeStr = now.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' });

            // Створюємо запис БЕЗ vazos (col3)
            const entry = {
                date: dateStr,
                time: timeStr,
                valvula: valvula,
                entrada: entrada,
                saida: saida,
                result: resultText
            };

            // Завантажуємо історію, додаємо новий запис і зберігаємо
            let history = JSON.parse(localStorage.getItem('regaDataV2')) || [];
            history.unshift(entry); // Додаємо на початок
            localStorage.setItem('regaDataV2', JSON.stringify(history));
            
            // Очищуємо поля після збереження (опціонально, розкоментуй якщо потрібно)
            // clearAll(); 
            
            updateHistoryUI();
        });

        // Функція побудови ієрархічного списку
        function updateHistoryUI() {
            const historyList = document.getElementById("history-list");
            historyList.innerHTML = ""; 

            let history = JSON.parse(localStorage.getItem('regaDataV2')) || [];

            if (history.length === 0) {
                historyList.innerHTML = "<div style='text-align: center; color: #777; background: #fff; padding: 10px; border: 1px solid #ccc; border-radius: 5px;'>Sem dados guardados</div>";
                return;
            }

            // Групуємо дані: спочатку по Днях, потім по Валвулах
            const groupedData = history.reduce((acc, curr) => {
                if (!acc[curr.date]) acc[curr.date] = {};
                if (!acc[curr.date][curr.valvula]) acc[curr.date][curr.valvula] = [];
                acc[curr.date][curr.valvula].push(curr);
                return acc;
            }, {});

            // Генеруємо HTML-структуру
            for (const [date, valves] of Object.entries(groupedData)) {
                // Блок Дня
                const dateDetails = document.createElement("details");
                dateDetails.style.marginBottom = "10px";
                dateDetails.innerHTML = `<summary style="font-weight: bold; font-size: 16px; cursor: pointer; padding: 10px; background: #007bff; color: white; border-radius: 5px; outline: none;">📅 Data: ${date}</summary>`;
                
                const dateContainer = document.createElement("div");
                dateContainer.style.padding = "10px";
                dateContainer.style.backgroundColor = "#fff";
                dateContainer.style.border = "1px solid #ccc";
                dateContainer.style.borderTop = "none";
                dateContainer.style.borderBottomLeftRadius = "5px";
                dateContainer.style.borderBottomRightRadius = "5px";

                for (const [valve, entries] of Object.entries(valves)) {
                    // Блок Валвули всередині Дня
                    const valveDetails = document.createElement("details");
                    valveDetails.style.marginBottom = "8px";
                    valveDetails.innerHTML = `<summary style="font-weight: bold; font-size: 15px; cursor: pointer; padding: 8px; background: #e9ecef; border-radius: 5px; outline: none; border: 1px solid #ddd;">💧 Válvula ${valve}</summary>`;
                    
                    const entriesList = document.createElement("div");
                    entriesList.style.padding = "5px 10px";
                    entriesList.style.backgroundColor = "#fafafa";
                    entriesList.style.border = "1px solid #ddd";
                    entriesList.style.borderTop = "none";

                    // Список замірів (Час, Entrada, Saída, Відсоток)
                    entries.forEach(entry => {
                        const row = document.createElement("div");
                        row.style.padding = "8px 0";
                        row.style.borderBottom = "1px dashed #ccc";
                        row.style.fontSize = "14px";
                        row.innerHTML = `🕒 <strong>${entry.time}</strong> <br> Entrada: <strong>${entry.entrada}</strong> | Saída: <strong>${entry.saida}</strong> <br> Drenagem: <strong style="color: #007bff; font-size: 16px;">${entry.result}</strong>`;
                        entriesList.appendChild(row);
                    });

                    // Забираємо нижню лінію в останнього елемента
                    if(entriesList.lastChild) entriesList.lastChild.style.borderBottom = "none";

                    valveDetails.appendChild(entriesList);
                    dateContainer.appendChild(valveDetails);
                }

                dateDetails.appendChild(dateContainer);
                historyList.appendChild(dateDetails);
            }
        }

        function clearHistory() {
            if(confirm("Tem a certeza que deseja limpar todo o histórico?")) {
                localStorage.removeItem('regaDataV2');
                updateHistoryUI();
            }
        }

        window.addEventListener('load', updateHistoryUI);
        
                
    </script>
    
</body>
</html>
